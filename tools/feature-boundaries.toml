# Domain ownership for tools/check-feature-boundaries.py (ADR 0128, docs/architecture.md,
# docs/domain-map.md). Owners: the platform, nine domains and the application layer.

[domains]
# Dependency order (docs/architecture.md section 5.1). Owners in one group do not depend on
# each other; an owner reads published tables only from owners in earlier groups.
order = [
  ["platform"],
  ["governance"],
  ["resources"],
  ["networking", "naming"],
  ["traffic"],
  ["access"],
  ["costs", "observability"],
  ["operations"],
  ["app"],
]
# Identity tables that later owners may read directly. Only the owner writes them.
published = ["servers", "nodes", "users"]

# Every table and view in crates/panel/migrations/0001_current.sql has exactly one owner.
# An exact name wins over a prefix (written with a trailing "*"); the longest prefix wins
# otherwise. Prefixes cover one family of tables, so a new table must be registered here.
[tables]
platform = [
  "apsp_schema_baseline", "credential_entries", "notification_*", "panel_settings",
  "system_worker_heartbeats",
]
governance = [
  "admins", "administrator_*", "sessions", "auth_rate_limits", "passkey_*",
  "management_api_tokens", "management_audit", "enrollment_tokens", "record_retention_policy",
  "operations_backup_*", "operations_restore_drills", "system_observer_reports",
  "tool_advisory_observations",
]
resources = [
  "servers", "server_retirements", "fleet_profiles", "fleet_templates", "operations_cloud_*",
  "operations_hetzner_*", "alicloud_accounts", "alicloud_resources",
  "network_server_migration_previews",
]
networking = [
  "network_document*", "network_observations", "network_operation_links",
  "alicloud_managed_security_groups",
]
naming = [
  "dns_*", "ddns_*", "network_acme_*", "network_certificate_*", "network_dns_challenges",
]
traffic = [
  "nodes", "deployments", "server_module_status", "server_plugins", "runtime_*",
  "singbox_chain*", "singbox_live_chains", "singbox_ordered_*", "singbox_external_*",
  "singbox_source_*", "singbox_subscription_source*", "singbox_subscription_revision_nodes",
  "singbox_path_*", "singbox_deployment_*", "singbox_runtime_*", "singbox_installation",
  "singbox_managed_endpoint_versions", "singbox_node_metadata", "singbox_mixed_conversions",
  "singbox_legacy_takeovers", "singbox_retired_path_scopes",
  "singbox_resource_mutation_requests", "singbox_nexus_runtime_*", "singbox_nexus_node*",
]
access = [
  "users", "accesses", "usage_*", "singbox_account_*", "singbox_client_templates",
  "singbox_commerce_*", "singbox_credential_rotations", "singbox_desired_accesses",
  "singbox_entitlement_state", "singbox_invitation*", "singbox_mail_settings",
  "singbox_member*", "singbox_operation_*", "singbox_package_*", "singbox_payment_*",
  "singbox_policy_*", "singbox_portal_*", "singbox_quota_credits",
  "singbox_runtime_session_addresses", "singbox_subscription_domain",
  "singbox_subscription_host*", "singbox_usage_daily", "singbox_user_*", "singbox_wallet*",
  "singbox_nexus_bridge", "singbox_nexus_device_state", "singbox_nexus_identities",
  "singbox_nexus_imports", "singbox_nexus_metering", "singbox_nexus_plan_mappings",
  "singbox_nexus_records", "singbox_nexus_usage_deliveries",
]
costs = [
  "expense_*", "fleet_cost_records", "operations_cancellation_reminders", "exchange_rates",
  "alicloud_traffic_history",
]
observability = [
  "metrics_minutely", "telemetry_*", "server_network_*", "server_traffic_corrections",
  "alert_*", "server_alert_events", "fleet_events", "diagnostic_*", "server_ip_quality*",
  "network_probes", "network_workbench_*", "latency_tasks", "probe_*", "tcpquality_*",
  "operations_incident*", "singbox_reachability_*", "alicloud_events", "alicloud_deliveries",
]
operations = [
  "operations_history", "operations_jobs", "operations_maintenance", "operations_panel_steps",
  "operations_remediation_rules", "operations_schedules", "operations_server_locks",
  "operations_target_steps", "operations_templates", "fleet_operations",
  "fleet_config_history", "fleet_terminal_*", "remote_commands", "runtime_operations",
  "alicloud_operations", "alicloud_power_jobs", "alicloud_eip_rotations",
  "alicloud_security_group_operations",
]

# Code location to owner: the longest matching path prefix wins. Code that still lives in the
# platform crate or in a crate holding several domains is mapped to the domain it belongs to,
# so crossings are measured before the code moves (docs/architecture.md section 9).
