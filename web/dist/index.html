    <title>apsp · 服务器与节点</title>
    <script>
      // Theme before first paint; the same key is kept by stores/appearance.ts.
      (function () {
        var root = document.documentElement, saved = {}
        try { saved = JSON.parse(localStorage.getItem('apsp-appearance')) || {} } catch (error) {}
        var theme = saved.theme === 'light' || saved.theme === 'dark' ? saved.theme : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        root.dataset.theme = theme
        if (saved.density === 'compact') root.dataset.density = 'compact'
      })()
    </script>
