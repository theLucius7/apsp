name: Platform validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-linux:
    name: Agent Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            libc: musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
          - arch: amd64
            libc: gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - arch: arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
    env:
      PYTHONUTF8: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install compiler and fixture signature support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 python3-cryptography coreutils
      - name: Build and verify the static Agent on its native architecture
        if: matrix.libc == 'musl'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/apsp-artifacts'
      - name: Verify the installer, independent OpenRC services, and diagnostic jobs
        if: matrix.libc == 'musl'
        env:
          APSP_TEST_AGENT: /src/target/${{ matrix.target }}/release/apsp-agent
        run: bash scripts/ci-openrc-smoke.sh
      - name: Build and verify the dynamic glibc Agent
        if: matrix.libc == 'gnu'
        run: python3 tools/build-agent.py '${{ matrix.target }}' '${{ runner.temp }}/apsp-artifacts'
      - name: Verify native Agent operation and failed-update recovery
        run: python3 tools/agent-smoke.py 'target/${{ matrix.target }}/release/apsp-agent'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-agent-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/apsp-artifacts/
          if-no-files-found: error
          retention-days: 7

  runtime-linux:
    name: Runtime Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: runtime-validation
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - name: Install the pinned runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git curl python3 python3-requests gnupg dirmngr xz-utils unzip bzip2 zstd file binutils binutils-aarch64-linux-gnu build-essential pkg-config coreutils qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross
      - name: Build the complete upstream runtime for the selected libc
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: python3 tools/ci-run.py bash tools/build-singbox.sh "$RUNTIME_ARCH" "$RUNNER_TEMP/runtime-artifacts" "--libc=$RUNTIME_LIBC"
      - name: Run the binary in its target libc and architecture
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime-artifacts/sing-box/1.14.2/linux-$RUNTIME_LIBC-$RUNTIME_ARCH" -C "$RUNNER_TEMP/runtime"
          image=debian:bookworm-slim
          if [ "$RUNTIME_LIBC" = musl ]; then image=alpine:3.24.2; fi
          docker run --rm --network none --platform "linux/$RUNTIME_ARCH" -v "$RUNNER_TEMP/runtime:/runtime:ro" "$image" /runtime/sing-box version
      - name: Verify native configuration, traffic counters, and reload generation
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          binary="$RUNNER_TEMP/runtime/sing-box"
          if [ "$RUNTIME_ARCH" = arm64 ]; then
            printf '#!/bin/sh\nexec qemu-aarch64-static -L /usr/aarch64-linux-gnu "%s" "$@"\n' "$binary" > "$RUNNER_TEMP/runtime/run-runtime"
            chmod 755 "$RUNNER_TEMP/runtime/run-runtime"
            binary="$RUNNER_TEMP/runtime/run-runtime"
          fi
          APSP_TEST_SINGBOX="$binary" cargo test --locked --package apsp-adapter-singbox --test runtime -- --ignored
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-runtime-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/
          if-no-files-found: error
          retention-days: 7

  agent-native:
    name: Agent ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: windows
            arch: amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - platform: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    env:
      PYTHONUTF8: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Compile only the deliberately public CI test trust root
        shell: bash
        run: python scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Build the signer for the deliberately public TEST_ONLY key
        shell: bash
        run: |
          cargo build --locked -p apsp-protocol --example ci-fixture-sign --target '${{ matrix.target }}'
          signer="$PWD/target/${{ matrix.target }}/debug/examples/ci-fixture-sign"
          if [ '${{ matrix.platform }}' = windows ]; then signer=$(cygpath -w "$signer.exe"); fi
          printf '%s\n' "APSP_CI_FIXTURE_SIGNER=$signer" >> "$GITHUB_ENV"
      - name: Build, verify, and package the native Agent
        id: native-agent-build
        run: python tools/ci-run.py python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - name: Verify link publication under a restrictive umask
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          umask 077
          cargo test --locked -p apsp-agent-core --test artifacts atomic_writes_and_links_preserve_modes_and_real_files -- --exact
      - name: Verify native Agent operation and failed-update recovery
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/apsp-agent
          if [ '${{ matrix.platform }}' = windows ]; then binary="$binary.exe"; fi
          python tools/ci-run.py python tools/agent-smoke.py "$binary"
      - name: Build the pinned upstream native runtime
        id: native-runtime-build
        if: ${{ !cancelled() && steps.native-agent-build.outcome == 'success' }}
        run: python tools/ci-run.py python tools/build-runtime-native.py '${{ matrix.platform }}-${{ matrix.arch }}' .ci-artifacts
      - name: Verify native service installation and independent runtime
        if: ${{ !cancelled() && steps.native-runtime-build.outcome == 'success' }}
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/apsp-agent
          runtime=.ci-artifacts/sing-box/1.14.2/${{ matrix.platform }}-${{ matrix.arch }}
          if [ '${{ matrix.platform }}' = windows ]; then
            python tools/ci-run.py python tools/native-service-smoke.py "$binary.exe" "$runtime"
          else
            sudo env CI=true GITHUB_ACTIONS=true "APSP_CI_FIXTURE_SIGNER=$APSP_CI_FIXTURE_SIGNER" "$(command -v python)" tools/ci-run.py "$(command -v python)" tools/native-service-smoke.py "$binary" "$runtime"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  agent-freebsd:
    name: Agent FreeBSD 13+ (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/apsp-freebsd-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            vm_arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: arm64
            vm_arch: aarch64
            target: aarch64-unknown-freebsd
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: freebsd-cross-${{ matrix.target }}
          workspaces: . -> /tmp/apsp-freebsd-target
          cache-directories: ~/.cargo/bin
      - name: Install the reference cross compiler
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Cross compile using the FreeBSD 13 sysroot
        id: build
        env:
          AGENT_TARGET: ${{ matrix.target }}
        run: |
          cross build --locked --release --package apsp-agent --target "$AGENT_TARGET"
          mkdir -p .ci-binaries
          cp "$CARGO_TARGET_DIR/$AGENT_TARGET/release/apsp-agent" .ci-binaries/apsp-agent
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import tomllib

          target = os.environ['AGENT_TARGET']
          runpy.run_path('tools/build-agent.py')['verify_architecture'](Path('.ci-binaries/apsp-agent'), target)
          version = tomllib.loads(Path('crates/agent/Cargo.toml').read_text())['package']['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Build the pinned upstream FreeBSD runtime
        run: python3 tools/ci-run.py python3 tools/build-runtime-native.py 'freebsd-${{ matrix.arch }}' .ci-artifacts
      - name: Verify the binary on FreeBSD 13.5
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '13.5'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            chmod 755 .ci-binaries/apsp-agent
            test "$(.ci-binaries/apsp-agent --version)" = 'apsp-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/apsp-agent --help
            mkdir -p /tmp/apsp-runtime
            tar -xzf .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} -C /tmp/apsp-runtime
            /tmp/apsp-runtime/sing-box version
      - name: Verify the same binary on FreeBSD 14
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '14'
          arch: ${{ matrix.vm_arch }}
          copyback: false
          run: |
            set -eu
            test "$(.ci-binaries/apsp-agent --version)" = 'apsp-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/apsp-agent --help
            mkdir -p /tmp/apsp-runtime
            tar -xzf .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} -C /tmp/apsp-runtime
            /tmp/apsp-runtime/sing-box version
      - name: Verify and package the same binary on FreeBSD 15
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: '15'
          arch: ${{ matrix.vm_arch }}
          copyback: true
          prepare: pkg install -y python311 py311-sqlite3 py311-cryptography
          run: |
            set -eu
            python3.11 tools/build-agent.py '${{ matrix.target }}' .ci-artifacts --binary .ci-binaries/apsp-agent
            mkdir -p /tmp/apsp-cores
            sysctl kern.corefile=/tmp/apsp-cores/%N.%P.core
            ulimit -c unlimited
            result=0
            env GITHUB_ACTIONS=true APSP_SMOKE_CORE_DIR=/tmp/apsp-cores python3.11 tools/ci-run.py python3.11 tools/agent-smoke.py .ci-binaries/apsp-agent || result=1
            env CI=true GITHUB_ACTIONS=true python3.11 tools/ci-run.py python3.11 tools/native-service-smoke.py .ci-binaries/apsp-agent .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} || result=1
            exit "$result"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-runtime-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-agent-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
