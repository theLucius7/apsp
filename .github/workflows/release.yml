name: Signed release draft

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已上传离线签名的 agent-v 标签"
        required: true
        type: string
      publish:
        description: "验签及全部制品校验通过后发布草稿"
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: apsp-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      agent_version: ${{ steps.version.outputs.agent_version }}
    env:
      APSP_RELEASE_PUBLIC_KEYS: ${{ vars.APSP_RELEASE_PUBLIC_KEYS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require the tagged main commit and all acceptance checks
        run: python3 tools/publish.py check-tag --tag "$GITHUB_REF_NAME" --expected-sha "$GITHUB_SHA"
      - id: version
        name: Validate tag and production compile-time roots
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, pathlib, tomllib
          spec = importlib.util.spec_from_file_location('release', 'tools/release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          manifest = tomllib.loads(pathlib.Path('crates/agent/Cargo.toml').read_text())
          version = manifest['package']['version']
          release.ensure(isinstance(version, str), 'Agent version must be independent of panel')
          release.ensure(os.environ['GITHUB_REF_NAME'] == 'agent-v' + version, 'tag does not match Agent version')
          keys = pathlib.Path(os.environ['RUNNER_TEMP']) / 'production-public-keys.json'
          keys.write_text(os.environ['APSP_RELEASE_PUBLIC_KEYS'])
          release.load_roots(keys, publication=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('agent_version=' + version + '\n')
          PY

  agent:
    needs: metadata
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      APSP_RELEASE_PUBLIC_KEYS: ${{ vars.APSP_RELEASE_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: release-${{ matrix.target }}
      - name: Install native musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 coreutils
      - name: Build verified native Agent
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/artifacts'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-agent-${{ matrix.arch }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  runtime:
    needs: metadata
    # The pinned upstream Go toolchain runs on amd64 and cross-compiles arm64.
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: amd64
            libc: gnu
          - arch: arm64
            target: arm64
            libc: gnu
          - arch: amd64
            target: linux-musl-amd64
            libc: musl
          - arch: arm64
            target: linux-musl-arm64
            libc: musl
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/cache@v6.1.0
        id: runtime-cache
        with:
          path: ${{ runner.temp }}/artifacts/sing-box/1.14.2
          key: runtime-ubuntu24-1.14.2-${{ matrix.target }}-${{ hashFiles('tools/build-singbox.sh', 'tools/singbox-builder.Dockerfile') }}
      - name: Build pinned runtime on cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform=linux/amd64 -f tools/singbox-builder.Dockerfile -t apsp-release-runtime:1.14.2 .
          mkdir -p '${{ runner.temp }}/artifacts'
          libc_args=()
          if [[ '${{ matrix.libc }}' == musl ]]; then libc_args+=(--libc=musl); fi
          docker run --rm --platform=linux/amd64 -v '${{ runner.temp }}/artifacts:/artifacts' apsp-release-runtime:1.14.2 '${{ matrix.arch }}' /artifacts "${libc_args[@]}"
      - name: Inspect cached or fresh runtime without executing it
        run: |
          libc_args=()
          if [[ '${{ matrix.libc }}' == musl ]]; then libc_args+=(--libc=musl); fi
          python3 tools/verify-release-runtime.py --root '${{ runner.temp }}/artifacts' --arch '${{ matrix.arch }}' "${libc_args[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-runtime-${{ matrix.target }}
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  draft:
    needs: [metadata, agent, runtime, nodequality]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      AGENT_VERSION: ${{ needs.metadata.outputs.agent_version }}
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts
      - name: Render immutable installer and canonical manifests
        run: |
          python3 tools/release.py render-installer --template deploy/install.sh.tmpl --agent-unit deploy/apsp-agent.service --runtime-unit plugins/sing-box/apsp-singbox@.service --output '${{ runner.temp }}/install.sh'
          python3 tools/release.py assemble --source '${{ runner.temp }}/artifacts' --output '${{ runner.temp }}/release' --agent-version "$AGENT_VERSION" --runtime-version 1.14.2 --include-musl-runtime --tag "$RELEASE_TAG" --installer '${{ runner.temp }}/install.sh'
      - name: Create draft without any signing secret
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(
              '本草稿尚未签名，不能用于安装。\n\n'
              '在离线设备签名 SHA256SUMS，上传完整 SHA256SUMS.minisig，'
              '再手动运行签名与全部资产校验。CI 不保存正式私钥。\n')
          PY
          python3 tools/publish.py check-tag --tag "$RELEASE_TAG" --expected-sha "$BUILD_SHA"
          gh release create "$RELEASE_TAG" '${{ runner.temp }}/release/'* --repo '${{ github.repository }}' --verify-tag --target "$BUILD_SHA" --draft --title "Agent $AGENT_VERSION" --notes-file '${{ runner.temp }}/release-notes.md'

  nodequality:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Package the pinned NodeQuality wrapper for both architectures
        run: |
          bash tools/build-nodequality.sh amd64 '${{ runner.temp }}/artifacts'
          bash tools/build-nodequality.sh arm64 '${{ runner.temp }}/artifacts'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-nodequality-both
          path: ${{ runner.temp }}/artifacts/
          if-no-files-found: error

  verify-publication:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLISH: ${{ inputs.publish }}
      APSP_RELEASE_PUBLIC_KEYS: ${{ vars.APSP_RELEASE_PUBLIC_KEYS }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - name: Verify signed assets, tagged main CI and publication identities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          Path(os.environ['RUNNER_TEMP'], 'production-public-keys.json').write_text(os.environ['APSP_RELEASE_PUBLIC_KEYS'])
          PY
          publication_args=()
          if [[ "$PUBLISH" == true ]]; then publication_args+=(--publish); fi
          python3 tools/publish.py --evidence '${{ runner.temp }}/publication-evidence.json' verify-publication --trusted-keys '${{ runner.temp }}/production-public-keys.json' --tag "$RELEASE_TAG" "${publication_args[@]}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-publication-evidence
          path: ${{ runner.temp }}/publication-evidence.json
          if-no-files-found: error
