name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: apsp
          POSTGRES_PASSWORD: apsp-test
          POSTGRES_DB: apsp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apsp"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://apsp:apsp-test@127.0.0.1:5432/apsp_test
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - name: Install the independent Release signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      - name: Check committed frontend build
        run: git diff --exit-code -- web/dist
      - name: Check core boundary
        run: |
          python3 tools/check-core-boundary.py
          python3 -m unittest discover -s tests -p 'test_core_boundary.py'
      - name: Verify artifact build script contracts
        run: python3 tools/test-build-scripts.py
      - name: Verify deployment environment initialization
        run: python3 tools/test-init-env.py
      - name: Protect /opt like a production host
        # Bootstrap refuses to stage under directories another account can
        # write; the hosted image does not guarantee that for /opt.
        run: |
          stat -c 'before: %U:%G %a %n' /opt
          getfacl -p /opt 2>/dev/null || true
          sudo chown root:root /opt
          sudo chmod go-w /opt
          stat -c 'after: %U:%G %a %n' /opt / /opt/apsp 2>/dev/null || true
      - name: Verify real acceptance driver and runtime cache contracts
        run: |
          python3 scripts/test-e2e-driver.py
          python3 scripts/test-e2e-traffic-evidence.py
          python3 scripts/test-e2e-runtime.py
          python3 scripts/test-ci-signed-release.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify NodeQuality wrapper and artifact contracts
        run: |
          sudo python3 tools/test-nodequality.py
          python3 tools/test-diagnostic-modes.py
          python3 tools/test-nodequality-sources.py
          python3 tools/test-nodequality-report-policy.py
          python3 tools/test-nodequality-swap-policy.py
          python3 tools/test-nodequality-dependency-policy.py
          python3 tools/test-nodequality-data-policy.py
          python3 tools/test-nodequality-loader-policy.py
          python3 tools/test-nodequality-ranking-policy.py
          python3 tools/test-nodequality-ip-score-policy.py
          python3 tools/test-nodequality-netflix-policy.py
          python3 tools/test-nodequality-rootfs.py
          python3 tools/test-nodequality-rootfs-build.py
          python3 tools/test-nodequality-rootfs-artifact.py
          python3 tools/test-nodequality-node-query.py
          python3 tools/test-nodequality-node-query-artifact.py
      - name: Verify independent native artifact and managed controller contracts
        run: |
          python3 tools/test-bootstrap-artifact-contracts.py
          python3 tools/test-nodequality-native.py
          python3 tools/test-nodequality-native-sources.py
          python3 tools/test-nodequality-native-rootfs-artifact.py
          python3 tools/test-nodequality-rootfs-capacity.py
          python3 tools/test-ipquality-artifact.py
          python3 tools/test-ipquality-build.py
          python3 tools/test-ipquality-inputs.py
          python3 tools/test-ipquality-inputs-capacity.py
          python3 tools/test-ipquality-profile.py
          python3 tools/test-ipquality-runner.py
          python3 tools/test-managed-paths-preparation.py
          python3 tools/test-managed-paths-fixtures.py
          python3 tools/test-managed-paths-linux-contracts.py
          python3 tools/test-ordered-paths-native-contracts.py
          python3 tools/test-nodequality-native-browser-policy.py
          python3 tools/test-nodequality-native-data-policy.py
          python3 tools/test-nodequality-native-dependency-policy.py
          python3 tools/test-nodequality-native-ip-score-policy.py
          python3 tools/test-nodequality-native-netflix-policy.py
          python3 tools/test-nodequality-native-report-policy.py
          python3 tools/test-nodequality-native-fixture-process.py
          python3 tools/test-nodequality-native-watcher.py
          python3 tools/test-nodequality-access-policy.py
          python3 tools/test-nodequality-query-policy.py
          python3 tools/test-nodequality-openai-policy.py
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust and PostgreSQL tests
        run: python3 tools/ci-run.py cargo test --locked
      - name: Verify independent diagnostic services with real systemd
        run: |
          cargo test -p apsp-agent-core --lib --no-run --message-format=json > /tmp/apsp-core-tests.jsonl
          diagnostic_test_binary=$(python3 -c 'import json; print(next(item["executable"] for item in (json.loads(line) for line in open("/tmp/apsp-core-tests.jsonl")) if item.get("reason") == "compiler-artifact" and item.get("executable") and item["target"]["name"] == "apsp_agent_core"))')
          python3 tools/ci-run.py sudo "$diagnostic_test_binary" real_systemd_diagnostic_ --ignored --test-threads=1

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - name: Build and verify the complete Docker deployment
        run: bash scripts/ci-compose-smoke.sh

  agent-linux:
    name: Agent Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            libc: musl
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            rustflags: ''
          - arch: arm64
            libc: musl
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            rustflags: ''
          - arch: amd64
            libc: gnu
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
          - arch: arm64
            libc: gnu
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rustflags: -Ctarget-feature=-crt-static
    env:
      PYTHONUTF8: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install compiler and fixture signature support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential binutils python3 python3-cryptography coreutils
      - name: Build and verify the static Agent on its native architecture
        if: matrix.libc == 'musl'
        run: bash tools/build-agent.sh '${{ matrix.arch }}' '${{ runner.temp }}/apsp-artifacts'
      - name: Verify the installer, independent OpenRC services, and diagnostic jobs
        if: matrix.libc == 'musl'
        env:
          APSP_TEST_AGENT: /src/target/${{ matrix.target }}/release/apsp-agent
        run: python3 tools/ci-run.py bash scripts/ci-openrc-smoke.sh
      - name: Build and verify the dynamic glibc Agent
        if: matrix.libc == 'gnu'
        run: python3 tools/build-agent.py '${{ matrix.target }}' '${{ runner.temp }}/apsp-artifacts'
      - name: Verify native Agent operation and failed-update recovery
        env:
          APSP_EXPECT_RUNTIME_LIBC: gnu
        run: python3 tools/ci-run.py python3 tools/agent-smoke.py 'target/${{ matrix.target }}/release/apsp-agent'
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-agent-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/apsp-artifacts/
          if-no-files-found: error
          retention-days: 7

  runtime-linux:
    name: Runtime Linux ${{ matrix.libc }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        libc: [gnu, musl]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: runtime-validation
      - uses: docker/setup-qemu-action@v4.4.0
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - name: Install the pinned runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git curl python3 python3-requests gnupg dirmngr xz-utils unzip bzip2 zstd file binutils binutils-aarch64-linux-gnu build-essential pkg-config coreutils qemu-user-static libc6-arm64-cross libstdc++6-arm64-cross
      - name: Build the complete upstream runtime for the selected libc
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: python3 tools/ci-run.py bash tools/build-singbox.sh "$RUNTIME_ARCH" "$RUNNER_TEMP/runtime-artifacts" "--libc=$RUNTIME_LIBC"
      - name: Run the binary in its target libc and architecture
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
          RUNTIME_LIBC: ${{ matrix.libc }}
        run: |
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime-artifacts/sing-box/1.14.2/linux-$RUNTIME_LIBC-$RUNTIME_ARCH" -C "$RUNNER_TEMP/runtime"
          image=debian:bookworm-slim
          if [ "$RUNTIME_LIBC" = musl ]; then image=alpine:3.24.2; fi
          docker run --rm --network none --platform "linux/$RUNTIME_ARCH" -v "$RUNNER_TEMP/runtime:/runtime:ro" "$image" /runtime/sing-box version
      - name: Verify native configuration, traffic counters, and reload generation
        env:
          RUNTIME_ARCH: ${{ matrix.arch }}
        run: |
          binary="$RUNNER_TEMP/runtime/sing-box"
          if [ "$RUNTIME_ARCH" = arm64 ]; then
            printf '#!/bin/sh\nexec qemu-aarch64-static -L /usr/aarch64-linux-gnu "%s" "$@"\n' "$binary" > "$RUNNER_TEMP/runtime/run-runtime"
            chmod 755 "$RUNNER_TEMP/runtime/run-runtime"
            binary="$RUNNER_TEMP/runtime/run-runtime"
          fi
          APSP_TEST_SINGBOX="$binary" cargo test --locked --package apsp-adapter-singbox --test runtime -- --ignored
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-runtime-linux-${{ matrix.libc }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/runtime-artifacts/
          if-no-files-found: error
          retention-days: 7

  agent-native:
    name: Agent ${{ matrix.platform }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            rustflags: ''
          - platform: windows
            arch: amd64
            runner: windows-2025-vs2026
            target: x86_64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
          - platform: windows
            arch: arm64
            runner: windows-11-vs2026-arm
            target: aarch64-pc-windows-msvc
            rustflags: -Ctarget-feature=+crt-static
    env:
      PYTHONUTF8: '1'
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.x'
      - name: Compile only the deliberately public CI test trust root
        shell: bash
        run: python scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Build the signer for the deliberately public TEST_ONLY key
        shell: bash
        run: |
          cargo build --locked -p apsp-protocol --example ci-fixture-sign --target '${{ matrix.target }}'
          signer="$PWD/target/${{ matrix.target }}/debug/examples/ci-fixture-sign"
          if [ '${{ matrix.platform }}' = windows ]; then signer=$(cygpath -w "$signer.exe"); fi
          printf '%s\n' "APSP_CI_FIXTURE_SIGNER=$signer" >> "$GITHUB_ENV"
      - name: Build, verify, and package the native Agent
        id: native-agent-build
        run: python tools/ci-run.py python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts
      - name: Verify link publication under a restrictive umask
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          umask 077
          cargo test --locked -p apsp-agent-core --test artifacts atomic_writes_and_links_preserve_modes_and_real_files -- --exact
      - name: Verify native Agent operation and failed-update recovery
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/apsp-agent
          if [ '${{ matrix.platform }}' = windows ]; then binary="$binary.exe"; fi
          python tools/ci-run.py python tools/agent-smoke.py "$binary"
      - name: Build the pinned upstream native runtime
        id: native-runtime-build
        if: ${{ !cancelled() && steps.native-agent-build.outcome == 'success' }}
        run: python tools/ci-run.py python tools/build-runtime-native.py '${{ matrix.platform }}-${{ matrix.arch }}' .ci-artifacts
      - name: Verify native service installation and independent runtime
        if: ${{ !cancelled() && steps.native-runtime-build.outcome == 'success' }}
        shell: bash
        run: |
          binary=target/${{ matrix.target }}/release/apsp-agent
          runtime=.ci-artifacts/sing-box/1.14.2/${{ matrix.platform }}-${{ matrix.arch }}
          if [ '${{ matrix.platform }}' = windows ]; then
            python tools/ci-run.py python tools/native-service-smoke.py "$binary.exe" "$runtime"
          else
            sudo env CI=true GITHUB_ACTIONS=true "APSP_CI_FIXTURE_SIGNER=$APSP_CI_FIXTURE_SIGNER" "$(command -v python)" tools/ci-run.py "$(command -v python)" tools/native-service-smoke.py "$binary" "$runtime"
          fi
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-runtime-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-TEST_ONLY-agent-${{ matrix.platform }}-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  agent-freebsd:
    # One VM per job: vmactions keeps earlier VMs running and its SSH alias keeps
    # pointing at the first one, so several releases in one job silently run on
    # the first release only.
    name: Agent FreeBSD ${{ matrix.release }} (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: /tmp/apsp-freebsd-target
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        release: ['13.5', '14', '15']
        include:
          - arch: amd64
            vm_arch: x86_64
            target: x86_64-unknown-freebsd
          - arch: arm64
            vm_arch: aarch64
            target: aarch64-unknown-freebsd
          - release: '15'
            package: true
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: freebsd-cross-${{ matrix.target }}
          workspaces: . -> /tmp/apsp-freebsd-target
          cache-directories: ~/.cargo/bin
      - name: Install the reference cross compiler
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27 --locked
      - name: Cross compile using the FreeBSD 13 sysroot
        id: build
        env:
          AGENT_TARGET: ${{ matrix.target }}
        run: |
          cross build --locked --release --package apsp-agent --target "$AGENT_TARGET"
          mkdir -p .ci-binaries
          cp "$CARGO_TARGET_DIR/$AGENT_TARGET/release/apsp-agent" .ci-binaries/apsp-agent
          python3 - <<'PY'
          import os
          from pathlib import Path
          import runpy
          import tomllib

          target = os.environ['AGENT_TARGET']
          runpy.run_path('tools/build-agent.py')['verify_architecture'](Path('.ci-binaries/apsp-agent'), target)
          version = tomllib.loads(Path('crates/agent/Cargo.toml').read_text())['package']['version']
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Build the pinned upstream FreeBSD runtime
        run: python3 tools/ci-run.py python3 tools/build-runtime-native.py 'freebsd-${{ matrix.arch }}' .ci-artifacts
      - name: Verify the binary on FreeBSD ${{ matrix.release }}
        uses: vmactions/freebsd-vm@v1.5.8
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.vm_arch }}
          copyback: ${{ matrix.package == true }}
          prepare: ${{ matrix.package && 'sh tools/freebsd-ci-prepare.sh' || '' }}
          run: |
            set -eu
            chmod 755 .ci-binaries/apsp-agent
            test "$(.ci-binaries/apsp-agent --version)" = 'apsp-agent ${{ steps.build.outputs.version }}'
            .ci-binaries/apsp-agent --help
            mkdir -p /tmp/apsp-runtime
            tar -xzf .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} -C /tmp/apsp-runtime
            /tmp/apsp-runtime/sing-box version
            if [ '${{ matrix.package }}' != true ]; then exit 0; fi
            # The newest supported release also packages the binary and runs the
            # Agent and native service smoke tests.
            apsp-ci-python tools/build-agent.py '${{ matrix.target }}' .ci-artifacts --binary .ci-binaries/apsp-agent
            mkdir -p /tmp/apsp-cores
            sysctl kern.corefile=/tmp/apsp-cores/%N.%P.core
            ulimit -c unlimited
            result=0
            env GITHUB_ACTIONS=true APSP_SMOKE_CORE_DIR=/tmp/apsp-cores apsp-ci-python tools/ci-run.py apsp-ci-python tools/agent-smoke.py .ci-binaries/apsp-agent || result=1
            env CI=true GITHUB_ACTIONS=true apsp-ci-python tools/ci-run.py apsp-ci-python tools/native-service-smoke.py .ci-binaries/apsp-agent .ci-artifacts/sing-box/1.14.2/freebsd-${{ matrix.arch }} || result=1
            exit "$result"
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.package
        with:
          name: apsp-TEST_ONLY-runtime-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/sing-box/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.1
        if: matrix.package
        with:
          name: apsp-TEST_ONLY-agent-freebsd-${{ matrix.arch }}
          path: .ci-artifacts/agent/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  real-e2e:
    name: Reality installation and accounting
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: agent-linux
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Protect /opt like a production host
        # Bootstrap refuses to stage under directories another account can
        # write; the hosted image does not guarantee that for /opt.
        run: |
          stat -c 'before: %U:%G %a %n' /opt
          getfacl -p /opt 2>/dev/null || true
          sudo chown root:root /opt
          sudo chmod go-w /opt
          stat -c 'after: %U:%G %a %n' /opt / /opt/apsp 2>/dev/null || true
      - name: Compile only the deliberately public CI test trust root
        run: python3 scripts/ci-test-trust.py --github-env "$GITHUB_ENV"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: apsp-TEST_ONLY-agent-linux-musl-amd64
          path: ${{ runner.temp }}/apsp-agent
      - name: Install the independent operator signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.26.8
          cache: false
      - name: Restore the pinned upstream runtime
        id: runtime-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/apsp-runtime-artifacts
          key: apsp-runtime-linux-amd64-1.14.2-${{ hashFiles('tools/build-singbox.sh', 'tools/singbox-builder.Dockerfile') }}
      - name: Build the unchanged upstream runtime on a cache miss
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p '${{ runner.temp }}/apsp-runtime-artifacts'
          docker build --platform linux/amd64 -f tools/singbox-builder.Dockerfile -t apsp-ci-runtime-builder .
          docker run --rm --platform linux/amd64 \
            --mount 'type=bind,src=${{ runner.temp }}/apsp-runtime-artifacts,dst=/artifacts' \
            apsp-ci-runtime-builder amd64 /artifacts
          sudo chown -R "$(id -u):$(id -g)" '${{ runner.temp }}/apsp-runtime-artifacts'
          docker image rm apsp-ci-runtime-builder
      - name: Verify the restored or newly built runtime
        run: |
          python3 scripts/verify-e2e-runtime.py \
            '${{ runner.temp }}/apsp-runtime-artifacts' \
            '${{ runner.temp }}/apsp-runtime-check'
      - name: Cache the verified runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/apsp-runtime-artifacts
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Run real installation, Reality traffic, and restart accounting
        run: |
          bash scripts/ci-real-e2e.sh \
            --agent-root '${{ runner.temp }}/apsp-agent' \
            --runtime-root '${{ runner.temp }}/apsp-runtime-artifacts' \
            --summary '${{ runner.temp }}/apsp-real-e2e-summary.json'
      - name: Publish only the allowlisted acceptance summary
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: apsp-real-e2e-summary
          path: ${{ runner.temp }}/apsp-real-e2e-summary.json
          if-no-files-found: warn
          retention-days: 7
