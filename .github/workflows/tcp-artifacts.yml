name: Native TCP signed artifact contract
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_commit:
        description: Existing full lowercase source commit to verify (empty selects this workflow commit)
        required: false
        type: string
permissions:
  contents: read
jobs:
  native:
    name: Native TCP artifact (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      TCP_SOURCE_COMMIT: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          key: native-tcp-${{ matrix.target }}
      - name: Install native musl and independent public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential minisign python3
      - name: Reject an unknown compile-time source pin
        run: |
          if APSP_NATIVE_TCP_SOURCE_COMMIT=unknown cargo check --locked --package apsp-tcp-probe > "$RUNNER_TEMP/tcp-invalid-pin.log" 2>&1; then
            echo 'invalid source pin unexpectedly compiled'
            exit 1
          fi
          grep -q 'source commit must have 40 hexadecimal digits' "$RUNNER_TEMP/tcp-invalid-pin.log"
      - name: Build only the explicit Git snapshot using its own locked recipe
        run: |
          python3 tools/build-tcp-probe.py '${{ matrix.arch }}' "$RUNNER_TEMP/tcp-artifacts" --source-commit "$TCP_SOURCE_COMMIT"
      - name: Verify real CLI, static ELF, provenance and TEST_ONLY signed Release
        env:
          APSP_TCP_ARCH: ${{ matrix.arch }}
          APSP_TCP_ARTIFACT_ROOT: ${{ runner.temp }}/tcp-artifacts
        run: |
          export APSP_TCP_SOURCE_COMMIT="$TCP_SOURCE_COMMIT"
          python3 -m unittest discover -s tests -p test_tcp_probe_artifacts.py
          python3 -m unittest discover -s tests -p test_tcp_probe_native_bundle.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: TEST_ONLY-native-tcp-${{ matrix.arch }}
          path: ${{ runner.temp }}/tcp-artifacts/
          if-no-files-found: error

  bookworm:
    name: Native TCP Debian 12 startup and signed provenance
    runs-on: ubuntu-24.04
    container: rust:1.98.1-bookworm
    timeout-minutes: 30
    env:
      TCP_SOURCE_COMMIT: ${{ inputs.source_commit || github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install native musl and independent verifier
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 minisign musl-tools build-essential
          rustup target add x86_64-unknown-linux-musl
      - name: Build and execute the pinned native tool in Debian 12
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify "$TCP_SOURCE_COMMIT^{commit}"
          python3 tools/build-tcp-probe.py amd64 "$RUNNER_TEMP/tcp-artifacts" --source-commit "$TCP_SOURCE_COMMIT"
      - name: Verify all source, license and TEST_ONLY signature contracts
        env:
          APSP_TCP_ARCH: amd64
        run: |
          export APSP_TCP_SOURCE_COMMIT="$TCP_SOURCE_COMMIT"
          export APSP_TCP_ARTIFACT_ROOT="$RUNNER_TEMP/tcp-artifacts"
          python3 -m unittest discover -s tests -p test_tcp_probe_artifacts.py
          python3 -m unittest discover -s tests -p test_tcp_probe_native_bundle.py
