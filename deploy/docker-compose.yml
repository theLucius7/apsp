name: apsp

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apsp
      POSTGRES_USER: apsp
      POSTGRES_PASSWORD: ${APSP_DB_PASSWORD:?Set APSP_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U apsp -d apsp"]
      interval: 5s
      timeout: 3s
      retries: 12

  panel:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        APSP_RELEASE_PUBLIC_KEYS: ${APSP_RELEASE_PUBLIC_KEYS:-}
    image: apsp-panel:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APSP_DATABASE_URL: postgres://apsp:${APSP_DB_PASSWORD:?Set APSP_DB_PASSWORD in .env}@postgres:5432/apsp
      APSP_PUBLIC_URL: ${APSP_PUBLIC_URL:?Set APSP_PUBLIC_URL in .env}
      APSP_ADMIN_PASSWORD: ${APSP_ADMIN_PASSWORD:?Set APSP_ADMIN_PASSWORD in .env}
      APSP_LISTEN: 0.0.0.0:8080
      APSP_DATA_DIR: /data
      APSP_CREDENTIAL_KEYS: ${APSP_CREDENTIAL_KEYS:-}
      APSP_CREDENTIAL_CURRENT_KEY: ${APSP_CREDENTIAL_CURRENT_KEY:-}
      APSP_ABUSEIPDB_API_KEY: ${APSP_ABUSEIPDB_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${APSP_BIND_ADDRESS:-127.0.0.1}:${APSP_PORT:-8080}:8080"
    volumes:
      - panel-data:/data

volumes:
  postgres-data:
  panel-data:
