[package]
name = "apsp-panel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# The panel binary assembles the host with the compiled business plugins.
# Migrations stay here as one linear sequence shared by the host and plugins.
[dependencies]
apsp-panel-host.workspace = true
apsp-cloud-api.workspace = true
uuid.workspace = true
apsp-plugin-singbox.workspace = true
apsp-plugin-ddns.workspace = true
apsp-plugin-alicloud.workspace = true
apsp-protocol.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
serde.workspace = true
apsp-compiler.workspace = true
apsp-adapter-singbox.workspace = true
blake2.workspace = true
apsp-adapter-nodequality.workspace = true
reqwest.workspace = true
tokio-tungstenite.workspace = true
apsp-agent-core.workspace = true
apsp-adapter-sdk.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
tar = "0.4"
flate2 = "1"
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "=1.0.9"
tracing.workspace = true
tracing-subscriber.workspace = true
argon2 = "0.5"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
ring = "=0.17.14"
rust-embed = { version = "8", features = ["debug-embed"] }
tower-http = { version = "0.6", features = ["trace", "limit", "set-header"] }

x25519-dalek = { version = "2", features = ["static_secrets"] }
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
serde_json.workspace = true
toml = "0.8"
