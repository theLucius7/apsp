[workspace]
members = ["crates/protocol", "crates/compiler", "crates/panel", "crates/panel-host", "crates/agent", "crates/agent-core", "crates/adapter-sdk", "crates/adapter-singbox", "crates/adapter-nodequality", "crates/tcp-probe", "crates/adapter-tcpquality", "crates/adapter-ipquality", "plugins/singbox/panel", "plugins/ddns/panel", "plugins/alicloud/panel", "plugins/cloud_api/panel", "plugins/expenses/panel"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
apsp-protocol = { path = "crates/protocol" }
apsp-compiler = { path = "crates/compiler" }
apsp-agent-core = { path = "crates/agent-core" }
apsp-adapter-sdk = { path = "crates/adapter-sdk" }
apsp-adapter-singbox = { path = "crates/adapter-singbox" }
apsp-adapter-nodequality = { path = "crates/adapter-nodequality" }
apsp-adapter-tcpquality = { path = "crates/adapter-tcpquality" }
apsp-adapter-ipquality = { path = "crates/adapter-ipquality" }
apsp-panel-host = { path = "crates/panel-host" }
apsp-cloud-api = { path = "plugins/cloud_api/panel" }
apsp-plugin-singbox = { path = "plugins/singbox/panel" }
apsp-plugin-ddns = { path = "plugins/ddns/panel" }
apsp-plugin-alicloud = { path = "plugins/alicloud/panel" }
apsp-plugin-expenses = { path = "plugins/expenses/panel" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
base64 = "0.22"
minisign-verify = "=0.2.5"
blake2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros", "json", "uuid"] }
futures-util = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[profile.dev]
debug = 0
strip = "none"
incremental = false

[profile.test]
debug = 0
strip = "none"
incremental = false

[profile.release]
strip = true
lto = true
codegen-units = 1
